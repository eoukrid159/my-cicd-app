name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Verify required files exist
        run: |
          test -f index.html && echo "✅ index.html found" || (echo "❌ index.html missing" && exit 1)
          test -f app.js    && echo "✅ app.js found"    || (echo "❌ app.js missing"    && exit 1)

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Validate HTML structure
        run: |
          grep -q "<!DOCTYPE html>" index.html && echo "✅ DOCTYPE found" || (echo "❌ DOCTYPE missing" && exit 1)
          grep -q "<html"           index.html && echo "✅ html found"    || (echo "❌ html missing"    && exit 1)
          grep -q "app.js"          index.html && echo "✅ app.js ref found" || (echo "❌ app.js not referenced" && exit 1)
      - name: Validate JS structure
        run: |
          grep -q "addEventListener" app.js && echo "✅ event listener found" || (echo "❌ no event listener" && exit 1)

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build artifact
        run: |
          mkdir -p build
          cp index.html build/
          cp app.js     build/
          cp style.css  build/
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: web-app
          path: build/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Prepare pages content
        run: |
          mkdir -p build
          cp index.html build/
          cp app.js     build/
          cp style.css  build/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: build/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
